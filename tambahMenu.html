<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrewIT - Tambah Menu</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#3B2A20;">
    <div class="container-fluid">
      <a class="navbar-brand" href="menu.html">BrewIT</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="bahan.html">Bahan</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="tambahMenu.html">Tambah Menu</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h2>Form Tambah Menu</h2>

    <form id="form-tambah-menu" action="#" method="post">

      <label for="nama-menu">Nama Menu</label>
      <input type="text" id="nama-menu" name="nama-menu" placeholder="Milk Tea">

      <h3>Komposisi Bahan</h3>
      <div id="daftar-baris-bahan"></div>

      <button type="button" id="btn-tambah-bahan">+ Tambah Bahan</button>

      <p id="form-pesan" style="display:none; margin-top:10px;"></p>

      <button type="submit">Simpan Menu</button>

    </form>

    <h2>Bahan yang Sudah Ditambahkan</h2>

    <table>
      <tr>
        <th>Bahan</th>
        <th>Qty per Gelas</th>
        <th>Satuan</th>
      </tr>
      <tr>
        <td>Kopi</td>
        <td>1</td>
        <td>saset</td>
      </tr>
      <tr>
        <td>Susu full cream</td>
        <td>60</td>
        <td>ml</td>
      </tr>
      <tr>
        <td>Susu regal</td>
        <td>35</td>
        <td>ml</td>
      </tr>
      <tr>
        <td>Krim kental manis</td>
        <td>12,5</td>
        <td>ml</td>
      </tr>
      <tr>
        <td>Regal</td>
        <td>2</td>
        <td>pcs</td>
      </tr>
    </table>
  </main>

  <footer class="text-center py-3" style="background-color:#3B2A20; color:#CFC6B8;">
    <p class="mb-0">Aplikasi Stok Bahan Minuman</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
